          field_summary:
            - value: '<p>Our city is committed to maintaining the highest standards of service and quality of life for our residents. We continuously work to improve infrastructure, enhance public spaces, and ensure responsive governance.</p>'
              format: basic_html
          field_title:
            - value: 'A City Focused on Excellence'
