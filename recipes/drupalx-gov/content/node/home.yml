          revision_translation_affected:
            - value: true
          field_body:
            - value: '<h3>Stay Connected</h3><p>Subscribe to our city newsletter for updates on events, services, and important announcements. Follow us on social media for real-time information and community engagement opportunities.</p>'
              format: full_html
              summary: ''
          field_eyebrow:
            - value: 'Get Involved'
          field_link:
            - uri: 'internal:/subscribe'
              title: 'Sign up for notifications'
              options: {}
          field_link2:
