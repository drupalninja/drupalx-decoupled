          field_accordion_item:
            - entity:
                _meta:
                  version: '1.0'
                  entity_type: paragraph
                  uuid: home-acc-item1-4001-a001-000000000001
                  bundle: accordion_item
                  default_langcode: en
                default:
                  status:
                    - value: true
                  created:
                    - value: 1724541786
                  behavior_settings:
                    - value: {}
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>City Hall is open Monday through Friday from 8:30 AM to 5:00 PM. Most departments also offer online services 24/7 through our website. Some departments offer extended hours on Thursday evenings until 7:00 PM.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'What are City Hall hours?'
            - entity:
                _meta:
                  version: '1.0'
                  entity_type: paragraph
                  uuid: home-acc-item2-4001-a001-000000000002
                  bundle: accordion_item
                  default_langcode: en
                default:
                  status:
                    - value: true
                  created:
                    - value: 1724541786
                  behavior_settings:
                    - value: {}
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>You can report non-emergency issues like potholes, graffiti, street light outages, and other concerns through our online reporting system or by calling our 311 service line. For emergencies, always call 911.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'How do I report an issue in my neighborhood?'
            - entity:
                _meta:
                  version: '1.0'
                  entity_type: paragraph
                  uuid: home-acc-item3-4001-a001-000000000003
                  bundle: accordion_item
                  default_langcode: en
                default:
                  status:
                    - value: true
                  created:
                    - value: 1724541786
                  behavior_settings:
                    - value: {}
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>City council meetings are held on the second and fourth Tuesday of each month at 7:00 PM in the City Hall Council Chambers. Meetings are open to the public and are also streamed live on our website. Meeting agendas are published one week in advance.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'When are city council meetings held?'
