  body:
    - value: |-
        <h2>Comprehensive Budget Addresses Community Priorities</h2>
        <p>The city council has unanimously approved the annual budget for the upcoming fiscal year, allocating significant resources to infrastructure improvements, public safety, and community programs.</p>
        <p>The $85 million budget includes substantial investments in road repairs, water system upgrades, and park improvements that will benefit all residents and enhance quality of life in our community.</p>
        <h3>Key Budget Allocations</h3>
        <p>Major allocations include $25 million for infrastructure projects, $20 million for public safety services, $15 million for community programs, and $12 million for environmental initiatives.</p>
        <h3>Community Input Drives Decisions</h3>
        <p>The budget reflects extensive community input gathered through public hearings, surveys, and neighborhood meetings held throughout the budget development process.</p>
