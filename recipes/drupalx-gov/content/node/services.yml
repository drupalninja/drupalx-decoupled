                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>Most permits and licenses can be paid for online using credit cards, ACH transfers, or digital payment services. For in-person payments, we accept checks, money orders, and cash at the City Hall Finance Department.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'What payment methods are accepted for permits and fees?'
