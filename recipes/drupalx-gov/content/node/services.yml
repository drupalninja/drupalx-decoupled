                  behavior_settings:
                    - value: {}
                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>For most utility services, applications can be completed online through our secure portal. For new service connections, please allow 2-3 business days for processing. Emergency repair requests are prioritized and handled as quickly as possible.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'How long does it take to process utility service requests?'
            - entity:
                _meta:
