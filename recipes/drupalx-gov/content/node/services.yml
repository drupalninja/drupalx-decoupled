                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>Most city services can be accessed through our online portal at any time. For in-person assistance, visit City Hall during regular business hours: Monday-Friday 8:30am-5:00pm. Some departments offer extended hours on Thursdays until 7:00pm.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'How do I access city services?'
            - entity:
