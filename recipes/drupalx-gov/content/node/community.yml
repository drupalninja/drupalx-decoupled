                  revision_translation_affected:
                    - value: true
                  field_body:
                    - value: '<p>You can register for most community programs online through our community portal, by phone at (555) 123-4567, or in person at any community center. Registration typically opens 4-6 weeks before program start dates.</p>'
                      format: full_html
                      summary: ''
                  field_title:
                    - value: 'How do I sign up for community programs?'
