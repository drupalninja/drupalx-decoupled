                  field_body:
                    - value: '<p>To volunteer with city programs, visit our Volunteer Opportunities page or contact our Volunteer Coordinator at (555) 123-7890. We offer opportunities ranging from one-time events to ongoing commitments across various departments and community initiatives.</p>'
