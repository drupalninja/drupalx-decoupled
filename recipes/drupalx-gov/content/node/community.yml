                  field_body:
                    - value: '<p>Community programs are available to residents of all ages. Most programs offer financial assistance options based on household income. Please contact the specific program coordinator or visit our Community Services Department for more information about eligibility and assistance.</p>'
                      format: full_html
                      summary: ''
                  field_title:
