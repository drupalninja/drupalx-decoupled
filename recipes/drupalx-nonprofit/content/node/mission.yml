            - value: 'Our Story'
          field_title:
            - value: '25 Years of Service'
          field_text_layout:
            - value: left
          field_body:
            - value: '<p>Hope Foundation was born from a simple belief: every person deserves the opportunity to thrive. Founded in 1999 by a group of educators, healthcare workers, and community organizers, we started with a single after-school program serving 20 children.</p><p>Today, we operate across 15 cities, but our mission remains unchanged. We continue to be guided by the voices of the communities we serve, adapting our programs to meet evolving needs while staying true to our core values of compassion, integrity, innovation, and collaboration.</p><p>Our growth reflects not our ambition, but the trust placed in us by thousands of families, volunteers, donors, and community partners who share our vision of a more equitable world.</p>'
