          field_eyebrow:
            - value: 'Student Research'
          field_title:
            - value: 'Undergraduate & Graduate Research Opportunities'
          field_text_layout:
            - value: left
          field_body:
            - value: "<p>At Metropolitan University, research isn't just for faculty—it's an integral part of the student experience. We believe that hands-on research participation is essential for developing critical thinking skills and preparing the next generation of innovators.</p><h3>Undergraduate Research Program</h3><ul><li><strong>Research Assistantships:</strong> Work directly with faculty on cutting-edge projects</li><li><strong>Independent Study Projects:</strong> Pursue your own research interests with faculty mentorship</li><li><strong>Summer Research Intensive:</strong> 10-week paid research experience with presentation symposium</li><li><strong>Undergraduate Research Conference:</strong> Annual showcase of student research achievements</li></ul><h3>Graduate Research Excellence</h3><ul><li><strong>Dissertation Research:</strong> Original research contributing new knowledge to your field</li><li><strong>Interdisciplinary Collaborations:</strong> Cross-department projects addressing complex challenges</li><li><strong>Industry Partnerships:</strong> Real-world applications through corporate research collaborations</li><li><strong>International Research:</strong> Global research opportunities and exchange programs</li></ul><h3>Funding & Support</h3><ul><li><strong>Research Stipends:</strong> Competitive funding for undergraduate and graduate researchers</li><li><strong>Travel Grants:</strong> Support for presenting research at national and international conferences</li><li><strong>Equipment Access:</strong> State-of-the-art laboratories and computational resources</li><li><strong>Publication Support:</strong> Assistance with manuscript preparation and journal submission</li></ul>"
              format: basic_html
              summary: ''
          field_link:
            - uri: 'internal:/student-life'
              title: 'Explore Research Opportunities'
              options: {  }
          field_link2:
