            - value: 'Explore Our Colleges & Schools'
          field_body:
            - value: |
                <p>Our University is comprised of several specialized colleges and schools, each offering unique programs and research opportunities:</p>
                <ul>
                  <li>College of Arts & Humanities</li>
                  <li>School of Engineering & Applied Sciences</li>
                  <li>College of Natural & Health Sciences</li>
                  <li>The Business School</li>
                  <li>Graduate School of Advanced Studies</li>
