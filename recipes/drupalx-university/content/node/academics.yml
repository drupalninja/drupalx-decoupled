          field_title:
            - value: 'Degree Programs Overview'
          field_body:
            - value: |
                <p>We offer a wide array of degree options to suit your academic and career aspirations:</p>
                <p><strong>Undergraduate Programs:</strong> From Bachelor of Arts (B.A.) to Bachelor of Science (B.S.) degrees across 100+ majors.</p>
                <p><strong>Graduate Programs:</strong> Master's degrees (M.A., M.S., M.Eng., MBA) and specialized graduate certificates.</p>
                <p><strong>Doctoral Programs:</strong> Pursue a Ph.D. or professional doctorate in a variety of disciplines, contributing to cutting-edge research.</p>
