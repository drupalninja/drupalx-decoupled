            - value: 'Campus Facilities & Services'
          field_summary:
            - value: |
                <p>Our campus offers state-of-the-art facilities to support your academic and personal life:</p>
                <ul>
                  <li>Modern libraries with extensive digital and print resources.</li>
                  <li>Recreation center with gym, swimming pool, and sports courts.</li>
                  <li>Student health and wellness center.</li>
                  <li>Multiple dining halls and cafes offering diverse cuisines.</li>
                  <li>On-campus housing options.</li>
                </ul>
