            - value: 'Clubs & Organizations'
          field_body:
            - value: |
                <p>With over 200 student-run clubs and organizations, there is something for everyone! From academic societies to sports clubs, cultural groups to volunteer initiatives, you can explore your passions and make new friends.</p>
                <p>Popular options include the Debate Club, International Students Association, Coding Club, and the University Hiking Society.</p>
