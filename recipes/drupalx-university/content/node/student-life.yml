            - value: 'Supporting Your Complete Well-being'
          field_text_layout:
            - value: left
          field_body:
            - value: '<p>At Metropolitan University, we understand that student success depends on holistic well-being. Our comprehensive support services ensure you have the resources needed to thrive academically, emotionally, and physically.</p><h3>Health & Counseling Services</h3><ul><li><strong>Student Health Center:</strong> Full-service medical clinic with primary care and specialty services</li><li><strong>Counseling & Psychological Services:</strong> Mental health support, crisis intervention, and wellness programming</li><li><strong>Wellness Coaching:</strong> Personal wellness planning and lifestyle support</li><li><strong>Disability Services:</strong> Accommodation and support services for students with disabilities</li></ul><h3>Academic Support</h3><ul><li><strong>Academic Success Center:</strong> Tutoring, study skills workshops, and learning strategies</li><li><strong>Writing Center:</strong> Support for writing assignments across all disciplines</li><li><strong>Math & Science Learning Centers:</strong> Specialized support for STEM coursework</li><li><strong>Student Success Coaching:</strong> One-on-one guidance for academic and personal goals</li></ul><h3>Career Development</h3><ul><li><strong>Career Services:</strong> Resume building, interview preparation, and job search assistance</li><li><strong>Internship Coordination:</strong> Connections with local and national employers</li><li><strong>Alumni Mentoring:</strong> Networking opportunities with successful graduates</li><li><strong>Professional Development Workshops:</strong> Leadership, communication, and workplace skills</li></ul>'
              format: basic_html
              summary: ''
