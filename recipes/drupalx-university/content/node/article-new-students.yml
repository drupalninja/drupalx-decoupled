  body:
    - value: |-
        <h2>A Historic Welcome to Campus</h2>
        <p>Our university is proud to welcome the largest and most diverse incoming class in our 150-year history. This fall, we're greeting over 5,000 new students from around the world, representing a 15% increase from last year.</p>
        <p>The incoming class includes students from over 50 countries and all 50 U.S. states, creating an incredibly rich and diverse learning environment that reflects our commitment to global education and cultural exchange.</p>
        <h3>Academic Excellence and Diversity</h3>
        <p>This year's incoming students demonstrate exceptional academic achievement, with an average GPA of 3.8 and impressive accomplishments in research, community service, and leadership activities.</p>
        <h3>Comprehensive Orientation Programs</h3>
        <p>To help our new students transition successfully to university life, we've expanded our orientation programs to include academic workshops, social events, and mentorship opportunities with upperclassmen and faculty.</p>
